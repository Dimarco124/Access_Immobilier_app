<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" fill="none">
  <defs>
    <linearGradient id="logo_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="logo_accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="logo_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  
  <!-- Icon Emblem -->
  <g transform="translate(0, 4) scale(0.56)">
    <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#logo_bg)"/>
    <path d="M18 36 L50 14 L82 36" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="24" y="32" width="12" height="44" rx="6" fill="#FFFFFF"/>
    <rect x="64" y="32" width="12" height="44" rx="6" fill="#FFFFFF"/>
    <rect x="32" y="48" width="36" height="10" rx="5" fill="url(#logo_accent)"/>
    <circle cx="50" cy="32" r="5.5" fill="url(#logo_gold)"/>
  </g>
  
  <!-- Brand Typography -->
  <text x="68" y="36" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="26" letter-spacing="-0.03em" fill="#0F172A">HABITAT</text>
  <text x="69" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="9" letter-spacing="0.28em" fill="#2563EB">IMMOBILIER</text>
  <circle cx="198" cy="28" r="3" fill="#F59E0B"/>
</svg>
